[package]
name = "maqto"
version = "1.0.24"
description = "Maqto video editor"
edition = "2021"

[lib]
name = "maqto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
fontdb = "0.23"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
ort = "2.0.0-rc.15"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
