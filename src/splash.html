<!doctype html>
<html><head><meta charset="utf-8"><title>Maqto</title><style>
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
/* launch intro, in its own borderless window; Rust shows the editor and closes this at 2.9 s */
#intro { position: fixed; inset: 0; display: grid; place-items: center; animation: iOut .35s 2.55s ease-in forwards; }
#intro .isq { position: relative; width: 100vmin; aspect-ratio: 1; border-radius: 6.8%; background: #141518; overflow: hidden; animation: iBox .55s cubic-bezier(.16,1,.3,1) both, iShake .32s 1.32s linear both; }
#intro svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
#intro .ipat { animation: iDim .5s 1.2s ease-out forwards; }
#intro .ipat .b { opacity: 0; transform: translate(260px, -420px); animation: iBar .75s 0s cubic-bezier(.16,1,.3,1) forwards; }
#intro .ipat .s { opacity: 0; transform: scale(0); transform-box: fill-box; transform-origin: center; animation: iPop .5s 0s cubic-bezier(.34,1.56,.64,1) forwards; }
#intro .isym { transform-box: fill-box; transform-origin: center; animation: iSlam .34s 1.02s cubic-bezier(.7,0,.84,0) both; }
#intro .is1, #intro .is2 { transform-box: fill-box; }
#intro .is1 { animation: iS1 .34s 1.02s cubic-bezier(.7,0,.84,0) both; }
#intro .is2 { animation: iS2 .34s 1.02s cubic-bezier(.7,0,.84,0) both; }
#intro .iw > * { transform-box: fill-box; animation: iLet .42s 1.5s cubic-bezier(.16,1,.3,1) both; }
#intro .iflash { position: absolute; inset: 0; background: #5cd3c6; opacity: 0; animation: iFlash .45s 1.34s ease-out forwards; }
#intro .iring { position: absolute; left: 50%; top: 46%; width: 30%; aspect-ratio: 1; margin: -15% 0 0 -15%; border-radius: 50%; border: 3px solid #5cd3c6; opacity: 0; animation: iRing .6s 1.34s cubic-bezier(.16,1,.3,1) forwards; }
#intro .isheen { position: absolute; inset: -20% -60%; background: linear-gradient(105deg, transparent 42%, rgba(255,255,255,.12) 50%, transparent 58%); transform: translateX(-70%); animation: iSheen .7s 2.0s cubic-bezier(.4,0,.2,1) forwards; }
@keyframes iBox { from { transform: scale(.4) rotate(-12deg); opacity: 0; border-radius: 50%; } to { transform: none; opacity: 1; border-radius: 6.8%; } }
@keyframes iBar { to { opacity: 1; transform: none; } }
@keyframes iPop { to { opacity: 1; transform: none; } }
@keyframes iDim { to { opacity: .45; } }
@keyframes iSlam { from { transform: scale(3.2) rotate(-8deg); opacity: 0; } 60% { opacity: 1; } to { transform: none; opacity: 1; } }
@keyframes iS1 { from { transform: translate(-40%, 60%); } to { transform: none; } }
@keyframes iS2 { from { transform: translate(30%, -30%); } to { transform: none; } }
@keyframes iShake { 0%, 100% { translate: 0 0; } 20% { translate: -5px 4px; } 40% { translate: 4px -3px; } 60% { translate: -3px 2px; } 80% { translate: 2px -1px; } }
@keyframes iFlash { 0% { opacity: .55; } 100% { opacity: 0; } }
@keyframes iRing { from { transform: scale(.4); opacity: .9; border-width: 6px; } to { transform: scale(3.4); opacity: 0; border-width: 1px; } }
@keyframes iLet { from { transform: translateY(60%) scale(.8); clip-path: inset(0 0 100% 0); opacity: 0; } to { transform: none; clip-path: inset(0); opacity: 1; } }
@keyframes iSheen { to { transform: translateX(70%); } }
@keyframes iOut { to { opacity: 0; transform: scale(1.06); } }
@media (prefers-reduced-motion: reduce) { #intro * { animation-duration: .01s !important; animation-delay: 0s !important; } }
</style></head>
