<!doctype html>
<html><head><meta charset="utf-8"><title>Maqto</title><style>
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
/* launch intro in its own borderless window. The pattern and the logo drawing are a pre-rendered
   video (intro.mp4, made in Chrome: WebKit drops SVG stroke-draw animations); the box entrance and
   the fade out are CSS. splash.js starts it once the window is on screen. */
#intro { position: fixed; inset: 0; display: grid; place-items: center; }
#intro .isq { position: relative; width: 100vmin; aspect-ratio: 1; border-radius: 6.8%; background: #141518; overflow: hidden; transform: scale(.4) rotate(-12deg); opacity: 0; }
#intro video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#intro.go { animation: iOut .245s 1.82s ease-in forwards; }
#intro.go .isq { animation: iBox .385s cubic-bezier(.16,1,.3,1) forwards; }
@keyframes iBox { to { transform: none; opacity: 1; } }
@keyframes iOut { to { opacity: 0; transform: scale(1.06); } }
</style></head>
<body data-tauri-drag-region>
<div id="intro" aria-hidden="true"><div class="isq"><video src="intro.mp4" muted playsinline preload="auto"></video></div></div>
<script src="splash.js"></script>
</body></html>
