name: build

# Push to main: build Mac (Apple Silicon) + Windows installers and attach them to the run.
# Push a tag like v0.3.1 (npm run release): same, plus a published GitHub Release with signed
# updater files and latest.json, which installed copies of Kadr update from.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Install scripts download ffmpeg from GitHub releases, which sometimes answers 504: retry them with backoff.
      - run: npm ci --ignore-scripts
      - shell: bash
        run: |
          for i in 1 2 3 4 5; do
            npm rebuild && exit 0
            echo "install scripts failed (try $i), retrying in $((i * 20))s"; sleep $((i * 20))
          done
          exit 1

      - run: node scripts/fetch-bins.mjs

      - run: npm test

      # Bundling downloads NSIS/WebView2 tools from GitHub, which sometimes answers 504: one retry after a pause.
      - id: tauri1
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Kadr ${{ github.ref_name }}
          releaseDraft: false
          releaseBody: Download Kadr for Mac (.dmg) or Windows (setup.exe). Installed copies update themselves.

      - if: steps.tauri1.outcome == 'failure'
        shell: bash
        run: sleep 60

      - if: steps.tauri1.outcome == 'failure'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Kadr ${{ github.ref_name }}
          releaseDraft: false
          releaseBody: Download Kadr for Mac (.dmg) or Windows (setup.exe). Installed copies update themselves.

      - uses: actions/upload-artifact@v4
        with:
          name: kadr-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
